name: Build cheatbreaker libs

on:
  push:
    branches:
      - cheatbreaker
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: cheatbreaker

      - name: Install pnpm + Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Build modules
        run: pnpm build:modules

      - name: Commit built libs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add libs
          if git diff --cached --exit-code; then
            echo "No changes to commit."
          else
            git commit -m "chore: rebuild libs [skip ci]"
            git push
          fi
